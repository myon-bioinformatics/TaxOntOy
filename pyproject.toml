[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxontoy"
version = "0.1.0"
description = "Classify OnTautoLogy relation names and check that a graph's names are covered"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
taxontoy = "taxontoy:main"

[tool.setuptools]
py-modules = ["taxontoy"]
