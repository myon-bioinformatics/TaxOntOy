[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxontoy"
version = "0.5.0"
description = "Classify relation names, including repository distribution, and check graph coverage"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
taxontoy = "taxontoy:main"

[tool.setuptools]
py-modules = ["taxontoy"]
