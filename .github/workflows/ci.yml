name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          python-version: ${{ matrix.python }}
      - run: uv run --no-project python -S -m unittest discover -s tests -v
      - run: uv run --no-project python -S taxonomy.py validate otl-relations.json
      - run: uv run --no-project python -S taxonomy.py validate otl-relations.json --json
