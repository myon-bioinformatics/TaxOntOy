name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.15']
    env:
      ONTO_ROOT: ${{ github.workspace }}/ONTO
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/ONTO
          # First-parent merge of pull request #15 on main.
          ref: 89e23ddadb47f04bb10318a2232f2be554c6651f
          path: ONTO
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/OnTautoLogy
          # First-parent merge of pull request #47 on main.
          ref: 79cb14722e4bfb1343718cc492a256e090cbc110
          path: otl
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest
          python-version: ${{ matrix.python }}
      - name: Test
        run: uv run --no-project python -S -m unittest discover -s tests -v
      - name: Regenerate coverage and fail on drift
        run: |
          mkdir -p build
          cat > "$RUNNER_TEMP/canonicalize_graphs.py" << 'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          def canonical(payload, destination):
              if isinstance(payload.get("edges"), list):
                  payload["edges"] = sorted(payload["edges"], key=lambda edge: json.dumps(edge, ensure_ascii=False, sort_keys=True))
              if isinstance(payload.get("nodes"), list):
                  payload["nodes"] = sorted(payload["nodes"], key=lambda node: json.dumps(node, ensure_ascii=False, sort_keys=True))
              Path(destination).write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def capture(args):
              result = subprocess.run(args, capture_output=True)
              if result.returncode not in (0, 2):
                  sys.stderr.buffer.write(result.stderr)
                  raise SystemExit(result.returncode)
              return json.loads(result.stdout)

          sys.path.insert(0, "otl")
          canonical(capture([sys.executable, "-S", "otl/gh_audit/gh_audit.py", "audit", "otl/examples/audit-20261114.json"]), "build/audit.json")
          from ontautology import concept_edges
          corpus = json.loads(Path("otl/examples/concepts-20261115.json").read_text(encoding="utf-8"))
          canonical(concept_edges(corpus), "build/concepts.json")
          canonical(capture([sys.executable, "-S", "otl/tools/tautology.py", "cases", "otl/examples/concepts-20261115.json", "--graph"]), "build/cases.json")
          PY
          uv run --no-project python -S "$RUNNER_TEMP/canonicalize_graphs.py"
          uv run --no-project python -S taxontoy.py coverage \
            --graph audit=build/audit.json \
            --graph concepts=build/concepts.json \
            --graph cases=build/cases.json \
            --format json \
            --output build/coverage.json
          diff -u coverage.json build/coverage.json
          uv run --no-project python -S taxontoy.py candidates \
            --graph audit=build/audit.json \
            --graph concepts=build/concepts.json \
            --graph cases=build/cases.json \
            --format json \
            --output build/candidates.json
          diff -u candidates.json build/candidates.json
          uv run --no-project python -S taxontoy.py graph \
            --format json \
            --output build/repos-graph.json
          diff -u fixtures/repos/graph.json build/repos-graph.json
          uv run --no-project python -S taxontoy.py properties \
            --format json \
            --output build/repos-properties.json
          diff -u repos-properties.json build/repos-properties.json
          for profile in audit concepts cases; do
            uv run --no-project python -S taxontoy.py rank-unclassified "build/${profile}.json" \
              --profile "$profile" \
              --format json \
              --output "build/ranking-${profile}.json"
            diff -u "ranking-${profile}.json" "build/ranking-${profile}.json"
          done
      - name: Inference finds ONTO with no env vars
        run: |
          set -euo pipefail
          unset ONTO_ROOT ONTO_CHECKOUT TAXONTOY_TABLE TAXONTOY_GRAPH TAXONTOY_MANIFEST TAXONTOY_PIN_AUDIT TAXONTOY_REPO PYTHONPATH
          uv run --no-project python -S taxontoy.py validate --format json > "$RUNNER_TEMP/inferred-validate.json"
          uv run --no-project python -S - "$RUNNER_TEMP/inferred-validate.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["ok"] is True
          assert report["inputs"] == [{"path": "otl-relations.json", "sha256": report["inputs"][0]["sha256"]}]
          assert report["command"] == "validate"
          PY
          uv run --no-project python -S taxontoy.py coverage \
            --graph audit=build/audit.json \
            --graph concepts=build/concepts.json \
            --graph cases=build/cases.json \
            --format json \
            --output "$RUNNER_TEMP/inferred-coverage.json"
          diff -u coverage.json "$RUNNER_TEMP/inferred-coverage.json"
          uv run --no-project python -S -m unittest discover -s tests -q
